# Reverse-dependency check for kernR.
# Runs on push to a release tag and on manual dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

name: revdep.yaml

permissions: read-all

jobs:
  revdep:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::revdepcheck
            local::.
          needs: revdep

      - name: Run revdepcheck
        run: |
          revdepcheck::revdep_reset()
          revdepcheck::revdep_check(num_workers = 2)
          status <- revdepcheck::revdep_summary()
          if (any(status$status == "BROKEN")) stop("Reverse dependencies broken.")
        shell: Rscript {0}

      - name: Upload revdep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revdep-results
          path: revdep/
